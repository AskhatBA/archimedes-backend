version: '3.8'

services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Passqqaazz!1
      POSTGRES_DB: archimedes
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # backend ждёт этой проверки, а не просто старта контейнера: иначе миграция успевает
    # постучаться в базу, пока та ещё поднимается ("the database system is starting up").
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d archimedes"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

  backend:
    build: ./
    restart: always
    extra_hosts:
      - "misapi.archimedes.kz:192.168.10.1"
      - "mobileapi.archimedes.kz:10.0.2.254"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    # migrate deploy, а не db:migrate (migrate dev): на проде нужны только готовые миграции,
    # а migrate dev без TTY падает на любом вопросе и умеет предлагать сброс базы.
    command: >
      sh -c "
      npx prisma migrate deploy --schema=./src/infrastructure/db/schema.prisma &&
      npm start
      "

volumes:
  pgdata:
  redisdata:
